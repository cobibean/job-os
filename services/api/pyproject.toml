[project]
name = "jobos-api"
version = "0.1.0"
description = "Local application API for the JobOS desktop workbench"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
  "websockets==16.1.1",
]

[project.urls]
Homepage = "https://github.com/cobibean/job-os"
Repository = "https://github.com/cobibean/job-os.git"
Issues = "https://github.com/cobibean/job-os/issues"

[project.scripts]
jobos-init = "jobos_api.initialize_cli:main"

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobos_api"]
