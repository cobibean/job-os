[project]
name = "jobos-api"
version = "0.1.0"
description = "Private Mini-side application API for JobOS"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
  "websockets==16.1.1",
]

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobos_api"]
