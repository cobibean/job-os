[project]
name = "jobos-mcp"
version = "0.1.0"
description = "Thin MCP Adapter over the JobOS application API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobos_mcp"]
