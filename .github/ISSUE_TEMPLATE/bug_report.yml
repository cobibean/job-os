name: Bug report
description: Report a reproducible JobOS defect using synthetic data
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve JobOS. Do not include credentials, private documents, real job records, browser history, local private paths, or vulnerability details. Use SECURITY.md for confidential reports.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: The exact commit SHA or released version where this occurred.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS x64
        - Linux backend/source checks
        - Other or unsupported
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give the smallest repeatable steps using only synthetic data.
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Tool versions
      description: Include OS, architecture, Node, pnpm, Python, and uv versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized evidence
      description: Optional logs or screenshots with tokens, private paths, jobs, people, and document contents removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private data and this is not a confidential security report.
          required: true
