[project]
name = "job-os-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api", "services/mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["services/api/tests", "services/mcp/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
